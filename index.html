<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo list</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>


    <div id="todos">

    </div>

    <div id="creatingtododiv">
        <input placeholder="What you want to do ?" id="nameinpt">
        <input placeholder="Describe your problem" id="descriptioninpt">
        <input placeholder="date" id="dateinpt" type="date">
        <input placeholder="checklist"id="checklistinpt" type="checkbox">
        <label for="checklistinpt">Done ?</label>
        <label for="priorities">Choose a priority: </label>
        <select name="prioritiesoptions" for="priorities" id="priorityinpt">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>
        <button id="inptssend">send</button>
    </div>

    <div id="editcontainer">
        <p>Edit The settings</p>
        <button id="editbtn">X</button>
        <div>
            <input placeholder="What you want to do ?" id="nameinptedit">
            <input placeholder="Describe your problem" id="descriptioninptedit">
            <input placeholder="date" id="dateinptedit" type="date">
            <input placeholder="checklist"id="checklistinptedit" type="checkbox">
            <label for="checklistinpt">Done ?</label>
            <label for="priorities">Choose a priority: </label>
            <select name="prioritiesoptions" for="priorities" id="priorityinptedit">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
        </div>

        <button id="btnsendedit">send</button>
    </div>



    <script src="index.js"></script>
</body>
</html>
